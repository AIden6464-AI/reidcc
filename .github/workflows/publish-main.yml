# main is what users see: the app's source, assets, docs, license and a user README. dev has
# everything (specs, vision, the Python original, proxy, tests). Publishing is by hand:
#     git push origin dev:publish
# rewrites main's files from that commit, from the list below, as one commit on main (site/ is the website;
# pages.yml deploys it after this). Pushing to dev never touches main (Reid, 2026-11-25: "I don't wanna
# change main that's public"). A push to the `publish` branch, not Run workflow: that button only shows for
# workflows on the default branch (main), and this file lives on dev. Never commit to main by hand: the
# next publish overwrites it. Releases are tagged on main (release.yml): publish first, then tag.
name: publish main

on:
  push:
    branches: [publish]

permissions:
  contents: write

concurrency: publish-main

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: dev

      - uses: actions/checkout@v5
        with:
          ref: main
          path: main

      - name: Copy the user-facing files
        run: |
          cd main
          git rm -rq --ignore-unmatch . && git clean -fdq   # start empty, keep main's history
          cd ../dev
          for p in LICENSE.md .gitignore reidcc.ico assets docs personas/plain.md \
                   .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/pages.yml site \
                   rs/.gitignore rs/Cargo.toml rs/Cargo.lock rs/app rs/cli rs/core rs/ui; do
            cp -r --parents "$p" ../main/
          done
          cp .github/main/README.md ../main/README.md

      - name: Commit to main
        working-directory: main
        run: |
          git add -A
          if git diff --cached --quiet; then echo "main is up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Publish from dev ${GITHUB_SHA::7}"
          git push
