# Push a tag v<version> (matching [workspace.package] version in rs/Cargo.toml) to publish a release:
# the signed installer, its signature, and latest.json, which installed copies check for updates
# (vision/Spec/SPEC-github-repo.md Parts 3 and 4). Titled "beta"; not marked pre-release, because
# the updater reads /releases/latest and GitHub leaves pre-releases out of it.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write   # to start the site rebuild (last step)

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches the version
        shell: pwsh
        run: |
          $v = (Select-String -Path rs/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but rs/Cargo.toml says $v" }
          "VERSION=$v" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rs/ui/package-lock.json

      - name: Build UI
        working-directory: rs/ui
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs

      - name: Rust tests
        working-directory: rs
        run: cargo test --workspace

      - name: reid.exe (bundled next to Reidcc.exe)
        working-directory: rs
        shell: pwsh
        run: |
          cargo build --release -p reid
          New-Item -ItemType Directory -Force app/binaries | Out-Null
          Copy-Item target/release/reid.exe app/binaries/reid-x86_64-pc-windows-msvc.exe

      - name: Installer (signed for the updater)
        working-directory: rs/app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ../ui/node_modules/.bin/tauri build --config tauri.bundle.json

      - name: latest.json and the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "rs/target/release/bundle/nsis"
          $exe = "Reidcc_${env:VERSION}_x64-setup.exe"
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$exe"
          @{ version = $env:VERSION; notes = "Reidcc $env:VERSION beta"
             pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
             platforms = @{ "windows-x86_64" = @{ signature = (Get-Content "$dir/$exe.sig" -Raw).Trim(); url = $url } }
          } | ConvertTo-Json -Depth 5 | Set-Content latest.json
          $notes = @"
          **Beta.** Everything in Reidcc is beta: expect rough edges, and tell us about them in Issues.

          **Install:** download ``$exe`` and run it. No admin needed. It isn't code-signed yet, so Windows
          SmartScreen may say *Windows protected your PC*: choose *More info*, then *Run anyway*.
          Installed copies update themselves from here (the footer offers it; or ``reid --update``).

          Your profiles, memory and keys live in ``%USERPROFILE%\Reidcc`` and are never touched by
          install, update or uninstall.
          "@
          gh release create "${{ github.ref_name }}" "$dir/$exe" "$dir/$exe.sig" latest.json `
            --title "Reidcc $env:VERSION beta" --notes $notes

      # A release made with GITHUB_TOKEN starts no other workflows (pages.yml's release trigger stays
      # quiet), but a dispatch does: rebuild the site so its download button finds the installer.
      - name: Rebuild the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -R ${{ github.repository }}
