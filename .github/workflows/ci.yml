# Every push and PR: build the UI (Reidcc.exe embeds rs/ui/dist), then run the Rust tests.
# Debug build on purpose: the release profile (LTO, 1 codegen unit) costs several times the minutes.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rs/ui/package-lock.json

      - name: Build UI
        working-directory: rs/ui
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs

      - name: Rust tests
        working-directory: rs
        run: cargo test --workspace
