[project]
name = "aca-firing-api"
version = "2.0.0"
description = "Universal HTTP + WebSocket API for Associative Context Activation (ACA) and The Firing System with CAN + GC wire data layout"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
