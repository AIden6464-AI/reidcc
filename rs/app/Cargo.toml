[package]
name = "reidcc-app"
edition.workspace = true
version.workspace = true

[[bin]]
name = "Reidcc"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
reidcc-core = { path = "../core" }
tauri = { version = "=2.12.5", features = ["image-ico", "unstable"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
rfd = { version = "=0.17.2", default-features = false }
portable-pty = "=0.9.0"
windows-sys = { version = "=0.59.0", features = [
  "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading",
  "Win32_System_DataExchange", "Win32_System_Memory",
] }

[features]
default = ["custom-protocol"]
# Serve the built ui\dist from inside the exe (what `tauri build` turns on).
custom-protocol = ["tauri/custom-protocol"]
